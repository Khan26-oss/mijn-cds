<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        background-color: #17182d;
        color: white;
        font-family: Arial, Helvetica, sans-serif;
        text-align: center;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      .cd-container {
        display: flex;
        justify-content: center;
        gap: 24px;
        flex-wrap: wrap;
      }

      .cd {
        background-color: #22233e;
        width: 160px;
        padding: 20px;
        border-radius: 12px;
      }

      .cd-img img {
        width: 120px;
        height: 120px;
        object-fit: cover;
        border-radius: 8px;
      }

      .cd h2 {
        font-size: 18px;
      }

      .cd p {
        font-size: 14px;
      }

      .cd a {
        color: lightblue;
        text-decoration: none;
      }

      .cd a:hover {
        color: white;
      }
    </style>
  </head>
  <body>
    <h1>🎜 Mijn top 5 CD's</h1>
